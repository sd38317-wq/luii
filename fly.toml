# fly.toml app configuration file generated for luii on 2026-07-21T01:29:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'luii'
primary_region = 'sin'

[build]

[env]
  DATABASE_PATH = '/data/prod.db'
  NODE_ENV = 'production'

[[mounts]]
  source = 'kidscafe_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
